name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同じブランチで新しい push があれば、古い実行は打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 品質ゲート
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: pnpm を用意する
        uses: pnpm/action-setup@v4

      - name: Node を用意する
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 依存をインストールする
        run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      - name: test
        run: pnpm test

      # CLAUDE.md 3.3 が宣言している層の境界を、宣言のままにせず落とす。
      # packages/core の依存ゼロと純粋性、ルート層から永続化層への直接依存を検査する。
      - name: アーキテクチャ境界の検査
        run: pnpm check:arch

      - name: ドキュメントのリンク検査
        run: pnpm check:links

  # 検査スクリプト自体が壊れていないことを確かめる。
  # 意図的な違反を作り、検査が 1 で落ちることを確認する。
  meta:
    name: 検査スクリプトの自己点検
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # このジョブは依存をインストールしない。検査スクリプトは依存を持たない
          # 素の Node スクリプトなので、pnpm を前提にしたキャッシュを無効にする。
          package-manager-cache: false

      - name: コアの純粋性の違反を検知できることを確かめる
        run: |
          cat > packages/core/src/__ci_violation.ts <<'EOF'
          export function impure(): number {
            return Date.now() + Math.random();
          }
          EOF
          if node scripts/check-architecture.mjs; then
            echo "::error::検査が違反を見逃した。scripts/check-architecture.mjs を確認すること。"
            exit 1
          fi
          echo "検査は違反を正しく検知した。"
          rm packages/core/src/__ci_violation.ts

      - name: シミュレータの再現性の違反を検知できることを確かめる
        run: |
          cat > packages/core/sim/__ci_violation.ts <<'EOF'
          export function unreproducible(): number {
            return Math.random();
          }
          EOF
          if node scripts/check-architecture.mjs; then
            echo "::error::検査が違反を見逃した。scripts/check-architecture.mjs を確認すること。"
            exit 1
          fi
          echo "検査は違反を正しく検知した。"
          rm packages/core/sim/__ci_violation.ts

      - name: shared が Node の組み込みに触ったことを検知できることを確かめる
        run: |
          mkdir -p packages/shared/src
          cat > packages/shared/src/__ci_violation.ts <<'EOF3'
          import { readFileSync } from 'node:fs';
          export const read = readFileSync;
          EOF3
          if node scripts/check-architecture.mjs; then
            echo "::error::検査が違反を見逃した。scripts/check-architecture.mjs を確認すること。"
            exit 1
          fi
          echo "検査は違反を正しく検知した。"
          rm packages/shared/src/__ci_violation.ts

      - name: ルート層が権限を判定したことを検知できることを確かめる
        run: |
          mkdir -p apps/server/routes
          cat > apps/server/routes/__ci_violation.ts <<'EOF4'
          export function handle(role: string): boolean {
            return role === 'staff';
          }
          EOF4
          if node scripts/check-architecture.mjs; then
            echo "::error::検査が違反を見逃した。scripts/check-architecture.mjs を確認すること。"
            exit 1
          fi
          echo "検査は違反を正しく検知した。"
          rm -r apps/server/routes

      - name: シミュレータの読み書きが入口の外に出たことを検知できることを確かめる
        run: |
          cat > packages/core/sim/__ci_violation.ts <<'EOF2'
          export function writes(): void {
            console.log(process.argv);
          }
          EOF2
          if node scripts/check-architecture.mjs; then
            echo "::error::検査が違反を見逃した。scripts/check-architecture.mjs を確認すること。"
            exit 1
          fi
          echo "検査は違反を正しく検知した。"
          rm packages/core/sim/__ci_violation.ts

  # 成果物は「1 つのコンテナ」なので（ADR-0005）、組み上がることを CI で確かめる。
  # 開発者の手元では Docker Desktop のイメージ取得が止まって確かめられなかった
  # （docs/260921_report_spike.md の 3.1）。ここが通れば、その未知が閉じる。
  image:
    name: コンテナが組み上がり、通しで動く
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Node を用意する
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # 依存はコンテナの中で入れる。ここでは smoke.sh が JSON を読むためだけに使う。
          package-manager-cache: false

      - name: イメージを組み立てる
        run: docker build -f infra/Dockerfile -t openseat:ci .

      - name: 大きさを出す
        run: docker images openseat:ci --format '{{.Size}}'

      - name: 受付から記録の取り戻しまで通す
        run: ./infra/smoke.sh openseat:ci
