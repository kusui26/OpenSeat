name: 機能の提案
description: 追加・変更したい機能を提案する
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提案の前に [開発プラン](https://github.com/kusui26/OpenSeat/blob/main/docs/260916_plan_OpenSeat.md) の 4.6（非目標）と 11.7（スコープの線引き）を確認してください。
        意図的にやらないと決めているものがあります。
  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: 機能ではなく、困っていることから書いてください。誰が、どの場面で困りますか。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案する解決策
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: 影響しそうな範囲
      multiple: true
      options:
        - コアロジック（状態機械・割当）
        - 利用者の画面
        - スタッフ・管理画面
        - 通知
        - データモデル
        - 運用・デプロイ
        - ドキュメント
        - 分からない
  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
  - type: checkboxes
    id: constraints
    attributes:
      label: 設計原則との整合（開発プラン 7.1、CLAUDE.md 第 2 章）
      options:
        - label: 個人情報（氏名・電話・位置情報・カメラ画像）を新たに収集しない
        - label: 「なぜそうなるのか」を利用者に一文で説明できる
        - label: システムに物理的な強制力がないことを前提にしている
