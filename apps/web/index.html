<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <!-- **拡大を止めない。** 文字を大きくして読む人がいる（10.4）。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1f2937" />
    <meta name="description" content="フードコートの座席順番待ち。アプリ不要・アカウント不要。" />
    <!-- **参照元を送らない。** URL に秘密パラメータが乗っている（9.8）。
         サーバも同じヘッダを返すが、静的ファイルだけを別の場所から配る場合に備える。 -->
    <meta name="referrer" content="no-referrer" />
    <!-- **iOS はマニフェストのアイコンを見ない。** ホーム画面に追加してもらえないと、
         iOS には通知が届かない（6.6）。 -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>OpenSeat</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
