# 手元で、本番と同じ形で動かす（開発プラン 9.13）。
#
# **第三者が `docker compose up -d` だけで起動できること**が 11.4 の完了条件の
# 1 つなので、ここは「読んで分かる最小」に保つ。
#
#   docker compose -f infra/docker-compose.yml up --build

services:
  openseat:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: openseat:local
    ports:
      - "8080:8080"
    environment:
      # 施設の識別子。Phase 2 では複数施設になる（9.6）。
      VENUE_ID: demo
      # まだ施設が無ければ、この数だけ席を作る。**席の一覧編集は PR 13。**
      SEED_TABLES: 8
      # 作った施設を、そのまま運用中にする。**運用の開始と終了は PR 14。**
      SEED_OPEN: "true"
      # 版を画面に出すためだけのもの。Railway では GIT_SHA が入る。
      GIT_SHA: local
      # **記録を外へ写す**（9.11、ADR-0019）。空なら複製しない ——
      # S3 を持たない施設でも、これだけで起動できるようにしてある。
      # 宛先の書き方は `infra/litestream.yml` の冒頭にある。
      LITESTREAM_REPLICA_URL: "${LITESTREAM_REPLICA_URL:-}"
      LITESTREAM_ACCESS_KEY_ID: "${LITESTREAM_ACCESS_KEY_ID:-}"
      LITESTREAM_SECRET_ACCESS_KEY: "${LITESTREAM_SECRET_ACCESS_KEY:-}"
    volumes:
      # **記録はここに残る。** コンテナを作り直しても消えない。
      - openseat-data:/data
    restart: unless-stopped

volumes:
  openseat-data:
